# moedex CI.
#
# Two stages:
#   gate   — `make health` (build + vet + test) on every push and MR. Fast.
#   parity — `make parity` (full-corpus ripgrep parity) ONLY on schedules/tags.
#            Requires a SELF-HOSTED runner that has the real corpus on disk at
#            $MOEDEX_CORPUS and ripgrep (`rg`) installed; tagged accordingly.
#
# Plus an optional MANUAL job to build + push the default and dense images.

default:
  image: golang:1.26

variables:
  # Pin the toolchain to the image's Go; never auto-download a toolchain in CI.
  GOTOOLCHAIN: local
  # Cache modules within the project dir so GitLab's cache: can pick them up.
  GOPATH: "$CI_PROJECT_DIR/.gocache"

cache:
  key:
    files:
      - go.sum
  paths:
    - .gocache/pkg/mod/

stages:
  - gate
  - parity
  - images

# --- gate: fast correctness on every push / MR ----------------------------
health:
  stage: gate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - make health

# --- parity: full-corpus ripgrep parity (expensive; gated) ----------------
# Runs ONLY on scheduled pipelines or tags. Needs a self-hosted runner tagged
# `moedex-corpus` with:
#   * the corpus checked out at $MOEDEX_CORPUS (default ~/TCGitlab if unset),
#   * ripgrep (`rg`) on PATH,
#   * enough disk for the .parity-work scratch dir.
parity:
  stage: parity
  tags:
    - moedex-corpus
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_TAG'
  script:
    - rg --version
    - make parity
  artifacts:
    when: always
    paths:
      - PARITY-REPORT.md
    expire_in: 30 days

# --- images: optional manual build + push of both images ------------------
# Requires a runner with Docker available (docker-in-docker service or a
# docker-socket runner). Pushes to the project's container registry.
build-images:
  stage: images
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - when: manual
  allow_failure: true
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:latest" -f Dockerfile .
    - docker build -t "$CI_REGISTRY_IMAGE:dense" -f Dockerfile.dense .
    - docker push "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:dense"
