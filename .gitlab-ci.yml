# moedex CI.
#
# Two validation stages:
#   gate   — `make health` (build + vet + test) on every push and MR. Fast.
#            The image installs ripgrep so internal/search's rg-backed parity
#            unit tests (parity_test.go) actually run here instead of
#            skipping via requireRipgrep.
#   parity — corpus-dependent product checks. Full-corpus ripgrep parity runs
#            on schedules and tags; private graph-gold evaluation runs on
#            schedules. Neither blocks ordinary pushes or MRs. These checks
#            require a SELF-HOSTED runner
#            that has the real corpus on disk at $MOEDEX_CORPUS and ripgrep
#            (`rg`) installed; tagged accordingly.
#
# Plus an optional MANUAL job to build + push the default and dense images.
# CodeGraph/Moedex paired comparisons run manually outside CI. Generic recorder
# tests below use synthetic data; they do not run a product comparison.

default:
  image: golang:1.26

variables:
  # Pin the toolchain to the image's Go; never auto-download a toolchain in CI.
  GOTOOLCHAIN: local
  # Cache modules within the project dir so GitLab's cache: can pick them up.
  GOPATH: "$CI_PROJECT_DIR/.gocache"

cache:
  key:
    files:
      - go.sum
  paths:
    - .gocache/pkg/mod/

stages:
  - gate
  - parity
  - images

# --- gate: fast correctness on every push / MR ----------------------------
health:
  stage: gate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  before_script:
    # ripgrep so internal/search's rg-backed parity unit tests run on every
    # MR/push instead of skipping (the full-corpus `make parity` gate below
    # still needs the self-hosted runner's corpus and is separate).
    - apt-get update -qq && apt-get install -y -qq ripgrep
  script:
    - make health

# Compile every optional build-tagged arm on ordinary pushes/MRs. The ONNX and
# LSP suites are allowed to skip runtime integrations when their external
# runtime/server is absent; compilation and vetting are not optional.
tagged-check:
  stage: gate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - make tagged-check

# Generic recording/controller tests use synthetic data and need no corpus,
# provider credentials, Docker daemon or actual solver/model invocation.
comparison-harness:
  stage: gate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "push"'
      changes:
        - research/semantic-intelligence/agent-journeys/**/*
        - .gitlab-ci.yml
  before_script:
    - apt-get update -qq && apt-get install -y -qq python3
  script:
    - python3 -m unittest discover -s research/semantic-intelligence/agent-journeys -p 'test_*.py' -v

# --- parity: full-corpus ripgrep parity (scheduled/tagged product check) ---
# Run locally for query/search/parity changes with `make verify`; CI runs this
# corpus-dependent check only on schedules and tags. Needs a self-hosted runner
# tagged `moedex-corpus` with:
#   * the managed corpus checked out at $MOEDEX_CORPUS (default
#     ~/.moedex/corpus if unset),
#   * ripgrep (`rg`) on PATH,
#   * enough disk for the .parity-work scratch dir.
parity:
  stage: parity
  tags:
    - moedex-corpus
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_TAG'
  script:
    - rg --version
    - make parity
  artifacts:
    when: always
    paths:
      - PARITY-REPORT.md
    expire_in: 30 days

# --- graph-eval-private: scheduled private graph quality (self-hosted) ----
# This product check does not invoke CodeGraph and does not block push/MR CI.
# Configure these as runner/project variables (they are paths, not secrets):
#   * CI_MOEDEX_GRAPH_EVAL_SHARDS — mounted managed shards directory.
#   * CI_MOEDEX_GRAPH_GOLD — mounted reviewed gold JSON file.
# They map to the production variable names only in this job so `make health`
# continues to run the hermetic tier on ordinary shared runners.
#
# A Verified-precision failure is more likely to expose insufficient label
# coverage than a product regression: the 0.9 floor comes from a 1.0 baseline
# over roughly nine Verified edges, so one new false positive lands exactly on
# the floor. Check the labels before treating a Verified trip as graph breakage.
graph-eval-private:
  stage: parity
  tags:
    # This gate reads mounted private shards/gold, just like parity. Ordinary
    # Docker build runners cannot mount a workstation-specific configured path.
    # Scheduled evaluation requires a corpus runner and the configured mounts.
    - moedex-corpus
  variables:
    MOEDEX_GRAPH_EVAL_SHARDS: "$CI_MOEDEX_GRAPH_EVAL_SHARDS"
    MOEDEX_GRAPH_GOLD: "$CI_MOEDEX_GRAPH_GOLD"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  before_script:
    - |
      test -n "${MOEDEX_GRAPH_EVAL_SHARDS:-}" || {
        echo "MOEDEX_GRAPH_EVAL_SHARDS must point to the mounted managed shards" >&2
        exit 1
      }
      test -d "$MOEDEX_GRAPH_EVAL_SHARDS" || {
        echo "MOEDEX_GRAPH_EVAL_SHARDS is not a mounted directory: $MOEDEX_GRAPH_EVAL_SHARDS" >&2
        exit 1
      }
      test -n "${MOEDEX_GRAPH_GOLD:-}" || {
        echo "MOEDEX_GRAPH_GOLD must point to the mounted reviewed gold JSON file" >&2
        exit 1
      }
      test -r "$MOEDEX_GRAPH_GOLD" || {
        echo "MOEDEX_GRAPH_GOLD is not a readable mounted file: $MOEDEX_GRAPH_GOLD" >&2
        exit 1
      }
  script:
    - go run ./cmd/moedex graph build -shard-dir "$MOEDEX_GRAPH_EVAL_SHARDS"
    - make graph-eval-private

# --- images: optional manual build + push of both images ------------------
# Requires a runner with Docker available (docker-in-docker service or a
# docker-socket runner). Pushes to the project's container registry.
build-images:
  stage: images
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - when: manual
  allow_failure: true
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:latest" -f Dockerfile .
    - docker build -t "$CI_REGISTRY_IMAGE:dense" -f Dockerfile.dense .
    - docker push "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:dense"
