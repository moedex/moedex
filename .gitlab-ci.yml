# moedex CI.
#
# Two stages:
#   gate   — `make health` (build + vet + test) on every push and MR. Fast.
#            The image installs ripgrep so internal/search's rg-backed parity
#            unit tests (parity_test.go) actually run here instead of
#            skipping via requireRipgrep.
#   parity — `make parity` (full-corpus ripgrep parity). Runs on schedules
#            and tags, AND on any MR that touches internal/query,
#            internal/search, or internal/parity (CLAUDE.md: those packages
#            "must keep make verify green"). Requires a SELF-HOSTED runner
#            that has the real corpus on disk at $MOEDEX_CORPUS and ripgrep
#            (`rg`) installed; tagged accordingly.
#
# Plus an optional MANUAL job to build + push the default and dense images.

default:
  image: golang:1.26
  tags:
    - docker-image

variables:
  # Pin the toolchain to the image's Go; never auto-download a toolchain in CI.
  GOTOOLCHAIN: local
  # Cache modules within the project dir so GitLab's cache: can pick them up.
  GOPATH: "$CI_PROJECT_DIR/.gocache"

cache:
  key:
    files:
      - go.sum
  paths:
    - .gocache/pkg/mod/

stages:
  - gate
  - parity
  - images

# --- gate: fast correctness on every push / MR ----------------------------
health:
  stage: gate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  before_script:
    # ripgrep so internal/search's rg-backed parity unit tests run on every
    # MR/push instead of skipping (the full-corpus `make parity` gate below
    # still needs the self-hosted runner's corpus and is separate).
    - apt-get update -qq && apt-get install -y -qq ripgrep
  script:
    - make health

# --- parity: full-corpus ripgrep parity (expensive; gated) ----------------
# Runs on scheduled pipelines, tags, and any MR touching internal/query,
# internal/search, or internal/parity (CLAUDE.md: those packages "must keep
# make verify green"). Needs a self-hosted runner tagged `moedex-corpus` with:
#   * the managed corpus checked out at $MOEDEX_CORPUS (default
#     ~/.moedex-managed if unset),
#   * ripgrep (`rg`) on PATH,
#   * enough disk for the .parity-work scratch dir.
parity:
  stage: parity
  tags:
    - moedex-corpus
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - internal/query/**/*
        - internal/search/**/*
        - internal/parity/**/*
  script:
    - rg --version
    - make parity
  artifacts:
    when: always
    paths:
      - PARITY-REPORT.md
    expire_in: 30 days

# --- graph-eval-private: reviewed private graph quality (self-hosted) -----
# Configure these as runner/project variables (they are paths, not secrets):
#   * CI_MOEDEX_GRAPH_EVAL_SHARDS — mounted managed shards directory.
#   * CI_MOEDEX_GRAPH_GOLD — mounted reviewed gold JSON file.
# They map to the production variable names only in this job so `make health`
# continues to run the hermetic tier on ordinary shared runners.
#
# A Verified-precision failure is more likely to expose insufficient label
# coverage than a product regression: the 0.9 floor comes from a 1.0 baseline
# over roughly nine Verified edges, so one new false positive lands exactly on
# the floor. Check the labels before treating a Verified trip as graph breakage.
graph-eval-private:
  stage: parity
  tags:
    - docker-image
  variables:
    MOEDEX_GRAPH_EVAL_SHARDS: "$CI_MOEDEX_GRAPH_EVAL_SHARDS"
    MOEDEX_GRAPH_GOLD: "$CI_MOEDEX_GRAPH_GOLD"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "push"'
      changes:
        - internal/graph/**/*
        - internal/contextwin/**/*
        - internal/mcp/**/*
        - internal/server/**/*
        - internal/eval/**/*
        - cmd/moedex-serve/**/*
        - cmd/moedex-index/**/*
        - Makefile
        - .gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  before_script:
    - |
      test -n "${MOEDEX_GRAPH_EVAL_SHARDS:-}" || {
        echo "MOEDEX_GRAPH_EVAL_SHARDS must point to the mounted managed shards" >&2
        exit 1
      }
      test -d "$MOEDEX_GRAPH_EVAL_SHARDS" || {
        echo "MOEDEX_GRAPH_EVAL_SHARDS is not a mounted directory: $MOEDEX_GRAPH_EVAL_SHARDS" >&2
        exit 1
      }
      test -n "${MOEDEX_GRAPH_GOLD:-}" || {
        echo "MOEDEX_GRAPH_GOLD must point to the mounted reviewed gold JSON file" >&2
        exit 1
      }
      test -r "$MOEDEX_GRAPH_GOLD" || {
        echo "MOEDEX_GRAPH_GOLD is not a readable mounted file: $MOEDEX_GRAPH_GOLD" >&2
        exit 1
      }
  script:
    - go run ./cmd/moedex-index graph -shard-dir "$MOEDEX_GRAPH_EVAL_SHARDS"
    - make graph-eval-private

# --- images: optional manual build + push of both images ------------------
# Requires a runner with Docker available (docker-in-docker service or a
# docker-socket runner). Pushes to the project's container registry.
build-images:
  stage: images
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - when: manual
  allow_failure: true
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:latest" -f Dockerfile .
    - docker build -t "$CI_REGISTRY_IMAGE:dense" -f Dockerfile.dense .
    - docker push "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:dense"
